name: iOS Experimental Build

on:
  workflow_dispatch:

jobs:
  ios:
    name: Build iOS ARM64
    runs-on: macos-15

    steps:
      - name: Checkout Chaotix
        uses: actions/checkout@v4

      - name: Checkout SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.2.24
          path: _sdl3

      - name: Checkout SDL3_ttf
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL_ttf
          ref: release-3.2.2
          path: _sdl3_ttf
          submodules: recursive

      - name: Configure iOS
        shell: bash
        run: |
          export SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/_sdl3"
          export CHAOTIX_ROM=""

          cmake --preset ios \
            -DCHAOTIX_SDL3_TTF_SOURCE_DIR="$GITHUB_WORKSPACE/_sdl3_ttf" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_SHARED_LINKER_FLAGS="-framework CoreFoundation -framework CoreText -framework CoreGraphics"

      - name: Build iOS
        run: |
          cmake --build build/ios \
            --config Release \
            --target chaotix \
            --parallel 3

      - name: Fix and bundle SDL libraries
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find build/ios -type d \
            -name "ChaotixRecompiled.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: Application bundle not found"
            exit 1
          fi

          echo "Application found: $APP"

          FRAMEWORKS="$APP/Frameworks"
          EXECUTABLE="$APP/ChaotixRecompiled"

          mkdir -p "$FRAMEWORKS"

          SDL3=$(find build/ios -type f \
            -name "libSDL3.0.dylib" -print -quit)

          SDLTTF=$(find build/ios -type f \
            -name "libSDL3_ttf.0.2.2.dylib" -print -quit)

          if [ -z "$SDL3" ] || [ -z "$SDLTTF" ]; then
            echo "ERROR: Required SDL libraries not found"
            exit 1
          fi

          echo "Copying SDL3..."
          cp "$SDL3" "$FRAMEWORKS/libSDL3.0.dylib"

          echo "Copying SDL3_ttf..."
          cp "$SDLTTF" "$FRAMEWORKS/libSDL3_ttf.0.dylib"

          echo "Updating library identifiers..."

          install_name_tool \
            -id "@rpath/libSDL3.0.dylib" \
            "$FRAMEWORKS/libSDL3.0.dylib"

          install_name_tool \
            -id "@rpath/libSDL3_ttf.0.dylib" \
            "$FRAMEWORKS/libSDL3_ttf.0.dylib"

          echo "Updating SDL3_ttf dependencies..."

          install_name_tool \
            -change "@rpath/libSDL3.0.dylib" \
            "@loader_path/libSDL3.0.dylib" \
            "$FRAMEWORKS/libSDL3_ttf.0.dylib"

          echo "Updating application dependencies..."

          install_name_tool \
            -change "@rpath/libSDL3_ttf.0.dylib" \
            "@executable_path/Frameworks/libSDL3_ttf.0.dylib" \
            "$EXECUTABLE"

          install_name_tool \
            -change "@rpath/libSDL3.0.dylib" \
            "@executable_path/Frameworks/libSDL3.0.dylib" \
            "$EXECUTABLE"

          echo "Adding application framework search path..."

          if ! otool -l "$EXECUTABLE" | grep -q \
            "@executable_path/Frameworks"; then

            install_name_tool \
              -add_rpath "@executable_path/Frameworks" \
              "$EXECUTABLE"
          fi

          echo "Checking executable dependencies..."
          otool -L "$EXECUTABLE"

          echo "Checking SDL3_ttf dependencies..."
          otool -L "$FRAMEWORKS/libSDL3_ttf.0.dylib"

          echo "Final bundled libraries:"
          ls -lah "$FRAMEWORKS"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find build/ios -type d \
            -name "ChaotixRecompiled.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: Application bundle not found"
            exit 1
          fi

          mkdir -p output/Payload

          cp -R "$APP" output/Payload/

          cd output

          zip -qry ChaotixRecompiled-iOS.ipa Payload

          echo "IPA created successfully:"
          ls -lah ChaotixRecompiled-iOS.ipa

          rm -rf Payload

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ChaotixRecompiled-iOS
          path: output/ChaotixRecompiled-iOS.ipa
          if-no-files-found: error
